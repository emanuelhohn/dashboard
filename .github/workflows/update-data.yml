# Holt zweimal täglich die neusten Wirtschaftsdaten, speichert sie im Repository
# und veröffentlicht die Seite auf GitHub Pages.
# Einmalig nötig: Settings → Pages → Source: «GitHub Actions».
name: Daten aktualisieren

on:
  schedule:
    - cron: "15 5 * * *"   # 06:15 / 07:15 Schweizer Zeit
    - cron: "15 16 * * *"  # 17:15 / 18:15 Schweizer Zeit
  push:
    branches: [main]        # nach jedem Hochladen von Änderungen neu veröffentlichen
  workflow_dispatch:        # manuell starten: Actions → Daten aktualisieren → Run workflow

permissions:
  contents: write   # Daten ins Repository speichern
  actions: write    # Zeitplan aktiv halten (GitHub schaltet ihn sonst nach 60 Tagen ab)
  pages: write      # Seite veröffentlichen
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten abrufen
        if: github.event_name != 'push'
        run: python scripts/fetch_data.py

      - name: Daten speichern
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)"
          git push

      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
